<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModoPlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo-container">
                
                <h2 class="logo">ModoPlay</h2>
                <img src="assets/img/logo-nav.jpg" alt="">
            </div>

            <ul class="nav-links">
                <li>
                    <a href="#">Inicio</a>
                </li>
                <li>
                    <a href="#">Juegos</a>
                </li>
                <li>
                    <a href="#">Noticias</a>
                </li>
                <li>
                    <a href="#">Contacto</a>
                </li>

            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>PLAY CON HISTORIA</h1>
            <p>Noticias, historia y cultura gamer.</p>
            <button>Explorar</button>
        </div>
    </section>

    <section class="games">
        <h2>Juegos destacados</h2>
        <div class="cards">
            <div class="card">
                <img src="assets/img/game1.webp" alt="">
                <h3>Cyber Arena</h3>
                <p>Acción y estrategia futurista.</p>
            </div>

            <div class="card">
                <img src="assets/img/game2.jpg" alt="">
                <h3>Warzone X</h3>
                <p>Batallas online intensas.</p>
            </div>

            <div class="card">
                <img src="assets/img/game3.jpg" alt="">
                <h3>Pixel Legends</h3>
                <p>Aventura retro moderna.</p>
            </div>
        </div>
    </section>
</body>
</html>
